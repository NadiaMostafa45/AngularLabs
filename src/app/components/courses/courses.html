<div class="container mt-4">
    <select name="category" id="category" [(ngModel)]="selectCategoryId" class="form-select mb-4 w-auto">
      <option [value]="0">All Categories</option>
      @for (category of categories; track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  <div class="row g-4">
    @for (course of courses; track course.id) {
        @if(selectCategoryId==0 || course.catId==selectCategoryId){
      <div class="col-md-4 col-sm-6">
        <div class="card  h-100 shadow-sm"   [ngStyle]="{
    'background-color': course.seats <= 2 ? '#fff3cd' : 'white'
  }">  
          <img
            [src]="course.imageUrl"
            class="card-img-top"
            alt="{{ course.title }}"
            style="height: 200px; object-fit: cover"
          />

          <div class="card-body d-flex flex-column">
            <h5  [ngClass]="{ 'text-danger': course.seats === 0 }" class="card-title">{{ course.title }}</h5>

            <p  [ngClass]="{ 'text-danger': course.seats === 0 }"  class="card-text  mb-1">Instructor: {{ course.instructor }}</p>

            <p class="card-text fw-bold text-primary">${{ course.price | discount:30 }}</p>
            @if(course.seats===0){
                <p   class="card-text text-danger">course is full</p>
            }

            <p class="card-text">Seats: {{ course.seats }}</p>
            <button class="btn btn-danger m-4 " (click)="decreaseSeats(course)">decrease by 1</button>
            <button appDisableAfterClick [disabled]="course.seats === 0" class="btn btn-primary mt-auto">Register</button>
          </div>
        </div>
      </div>
    }
}
  </div>
</div>
